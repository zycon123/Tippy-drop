<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Tippy Drop! — Zycon Studios</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8be0ff">
  <meta name="description" content="Tippy Drop! Drop it. Stack it. Don't tip it. by Zycon Studios" />
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
      <div id="topBar">
        <div id="score">SCORE<br><span id="scoreVal">0</span></div>
        <div id="best">BEST<br><span id="bestVal">0</span></div>
        <div id="controls">
          <button id="soundBtn" title="Toggle sound">🔊</button>
          <button id="musicBtn" title="Toggle music">🎵</button>
        </div>
      </div>

      <div id="tippyMeter">
        <div id="tippyFill"></div>
        <div id="tippyLabel">STEADY</div>
      </div>

      <div id="combo" class="hidden">NICE! <span id="comboMult">x1</span></div>

      <div id="eventWarning" class="hidden">
        <div>⚠ TIPPY EVENT</div>
        <div id="eventText">EARTHQUAKE!</div>
      </div>

      <div id="startScreen" class="overlay">
        <div class="card">
          <h1>TIPPY DROP!</h1>
          <p class="tag">Drop it. Stack it. Don't tip it.</p>
          <div class="by">by Zycon Studios</div>
          <div class="bestSmall">Best: <span id="bestSmallVal">0</span></div>
          <button id="playBtn" class="big">PLAY</button>
          <div class="credits">Zycon Studios</div>
        </div>
      </div>

      <div id="tutorial" class="overlay hidden">
        <div class="card">
          <p class="hint">Drag to position</p>
          <p class="hint">Release to drop</p>
          <button id="gotIt">Got it</button>
        </div>
      </div>

      <div id="gameOver" class="overlay hidden">
        <div class="card">
          <h1>TIPPY DROP!</h1>
          <p>Score: <span id="finalScore">0</span></p>
          <p>Best: <span id="finalBest">0</span></p>
          <button id="playAgain" class="big">PLAY AGAIN</button>
          <button id="shareScore">SHARE SCORE</button>
        </div>
      </div>

    </div>

    <div id="credit">Zycon Studios</div>
  </div>

  <script src="https://unpkg.com/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="game.js"></script>
  <script>
    // Register service worker for PWA support (optional)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(()=>{/* silent */});
    }

    // Prevent pull to refresh on mobile (some browsers)
    let lastTouchY = 0;
    document.addEventListener('touchstart', (e) => { lastTouchY = e.touches[0].clientY; }, {passive:false});
    document.addEventListener('touchmove', (e) => {
      const touchY = e.touches[0].clientY;
      const touchX = e.touches[0].clientX;
      // block vertical overscroll when at top of the page or interacting with game canvas
      if (Math.abs(touchX - (window.innerWidth/2)) < window.innerWidth) e.preventDefault();
    }, {passive:false});
  </script>
</body>
</html>
